<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tienda | Lonier Skin</title>
  <meta name="description" content="Compra los productos de Lonier Skin en línea. Envío a todo México." />
  <link rel="icon" href="/assets/favicon-gota.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-gota.png" />
  <script>
    // Pantalla de carga con la gota (solo cuando se llegó tocando el logo). Ver js/layout.js.
    (function () {
      try {
        if (!sessionStorage.getItem("lonier_loader")) return;
        sessionStorage.removeItem("lonier_loader");
        var root = document.documentElement, start = Date.now(), WAIT = 250, MAX_WAIT = 1200, SHOW = 900;
        var shownAt = 0, last = "", stableFrames = 0;
        root.classList.add("is-loading", "loader-wait");
        // La gota aparece cuando el tamaño de la pantalla deja de cambiar (en iPhone se acomoda al cargar,
        // y tarda más después de jalar para actualizar). Nunca antes de WAIT ni después de MAX_WAIT.
        (function settle() {
          var v = window.visualViewport;
          var size = innerWidth + "x" + innerHeight + (v ? ":" + v.height + ":" + v.offsetTop + ":" + v.pageTop : "");
          stableFrames = size === last ? stableFrames + 1 : 0;
          last = size;
          var elapsed = Date.now() - start;
          if ((elapsed >= WAIT && stableFrames >= 10) || elapsed >= MAX_WAIT) {
            root.classList.remove("loader-wait");
            shownAt = Date.now();
            return;
          }
          requestAnimationFrame(settle);
        })();
        // Al tocar el logo o jalar para actualizar, la página siempre empieza hasta arriba.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        addEventListener("load", function () {
          scrollTo(0, 0);
          (function finish() {
            // La gota se queda al menos SHOW ms desde que apareció, para que se vea el llenado.
            if (!shownAt) return requestAnimationFrame(finish);
            setTimeout(done, Math.max(0, SHOW - (Date.now() - shownAt)));
          })();
          function done() {
            scrollTo(0, 0);
            if ("scrollRestoration" in history) history.scrollRestoration = "auto";
            root.classList.add("loaded");
            setTimeout(function () { root.classList.remove("is-loading", "loaded"); }, 360);
          }
        });
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container">
      <div class="section-head">
        <h2>Tienda</h2>
        <p>Skincare premium, directo de la marca a tu puerta.</p>
      </div>

      <div class="product-grid" id="productGrid"></div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { PRODUCTS, discountPercent } from "/js/store.js";
    import { initLayout, addToCartAndOpen, imgFallback } from "/js/layout.js";

    const grid = document.getElementById("productGrid");
    grid.innerHTML = PRODUCTS.filter((p) => p.active)
      .map((p) => {
        const pct = discountPercent(p);
        return `
        <article class="product-tile">
          <a class="product-tile-img" href="/producto?id=${p.id}">
            ${pct ? `<span class="discount-badge tile-badge">-${pct}%</span>` : ""}
            <img src="${p.images[0]}" alt="${p.name}" loading="lazy" />
          </a>
          <div class="product-tile-body">
            <h3><a href="/producto?id=${p.id}">${p.name}</a></h3>
            <p>${p.shortDescription}</p>
            <div class="tile-price">
              ${pct ? `<s class="old-price">$${p.compareAtPrice}</s>` : ""}
              <strong>$${p.price}</strong> <small>MXN</small>
            </div>
            <button class="btn btn-gold" data-add="${p.id}">Agregar al carrito</button>
          </div>
        </article>`;
      })
      .join("");

    grid.querySelectorAll("img").forEach(imgFallback);
    grid.querySelectorAll("[data-add]").forEach((btn) =>
      btn.addEventListener("click", () => addToCartAndOpen(btn.dataset.add))
    );

    initLayout();
  </script>
</body>
</html>
