<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gracias por tu compra | Lonier Skin</title>
  <meta name="robots" content="noindex" />
  <link rel="icon" href="/assets/favicon-gota.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-gota.png" />
  <script>
    // Pantalla de carga con la gota (solo cuando se llegó tocando el logo). Ver js/layout.js.
    (function () {
      try {
        if (!sessionStorage.getItem("lonier_loader")) return;
        sessionStorage.removeItem("lonier_loader");
        var root = document.documentElement, start = Date.now(), WAIT = 250, SHOW = 900;
        root.classList.add("is-loading", "loader-wait");
        setTimeout(function () { root.classList.remove("loader-wait"); }, WAIT);
        // Al tocar el logo o jalar para actualizar, la página siempre empieza hasta arriba.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        addEventListener("load", function () {
          scrollTo(0, 0);
          setTimeout(function () {
            scrollTo(0, 0);
            if ("scrollRestoration" in history) history.scrollRestoration = "auto";
            root.classList.add("loaded");
            setTimeout(function () { root.classList.remove("is-loading", "loaded"); }, 360);
          }, Math.max(0, WAIT + SHOW - (Date.now() - start)));
        });
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <div id="site-header"></div>

  <main class="section">
    <div class="container narrow">
      <div class="panel result" id="result">
        <div class="result-icon" id="icon"></div>
        <h1 class="page-title" id="title">¡Gracias por tu compra!</h1>
        <p id="message">Recibimos tu pedido. Te enviaremos la confirmación por correo.</p>
        <p class="order-ref" id="orderRef" hidden></p>
        <div class="result-actions">
          <a class="btn btn-gold" id="primaryAction" href="/tienda">Seguir comprando</a>
          <a class="btn btn-ghost" id="waAction" target="_blank" rel="noopener">Dudas por WhatsApp</a>
        </div>
      </div>
    </div>
  </main>

  <div id="site-footer"></div>

  <script type="module">
    import { cart } from "/js/cart.js";
    import { trackPurchase } from "/js/analytics.js";
    import { icon } from "/js/icons.js";
    import { initLayout, whatsappUrl } from "/js/layout.js";

    initLayout();

    const params = new URLSearchParams(location.search);
    const order = params.get("order") || params.get("external_reference");
    // Mercado Pago agrega ?status= (approved | pending | in_process | rejected | null); Stripe y PayPal regresan status=approved o pending.
    const status = params.get("status") || params.get("collection_status");

    const states = {
      approved: {
        icon: "check",
        title: "¡Gracias por tu compra!",
        message: "Recibimos tu pedido y tu pago. Te enviaremos la confirmación y el número de guía por correo.",
      },
      pending: {
        icon: "clock",
        title: "Tu pedido está pendiente de pago",
        message: "Si elegiste OXXO o transferencia, realiza el pago con la ficha que recibiste. En cuanto se acredite, preparamos tu envío.",
      },
      failed: {
        icon: "alert",
        title: "No se completó el pago",
        message: "No se realizó ningún cargo. Tu carrito sigue guardado para que lo intentes de nuevo con otro método.",
      },
    };

    const kind = status === "approved" ? "approved" : ["pending", "in_process"].includes(status) ? "pending" : "failed";
    const view = states[kind];

    document.getElementById("icon").innerHTML = icon(view.icon, { size: 32 });
    document.getElementById("icon").dataset.kind = kind;
    document.getElementById("title").textContent = view.title;
    document.getElementById("message").textContent = view.message;
    if (order) {
      const ref = document.getElementById("orderRef");
      ref.textContent = `Número de pedido: ${order}`;
      ref.hidden = false;
    }
    if (kind === "failed") {
      const primary = document.getElementById("primaryAction");
      primary.textContent = "Volver al carrito";
      primary.href = "/carrito";
    } else {
      if (kind === "approved") {
        const totals = cart.totals();
        trackPurchase({ orderId: order, total: Number(params.get("total")) || totals.total, lines: totals.lines });
      }
      cart.clear();
    }
    document.getElementById("waAction").href = whatsappUrl(
      order ? `Hola, tengo una duda sobre mi pedido ${order}.` : "Hola, tengo una duda sobre mi pedido."
    );
  </script>
</body>
</html>
