<!DOCTYPE html>
<html lang="es-MX">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lonier Skin Serum | Lonier Skin</title>
  <meta name="description" content="Lonier Skin Serum con vitamina C, ácido hialurónico y niacinamida 3.5%. Desde $249.67 por frasco en paquete. Envío gratis llevando 3 piezas o desde $999." />
  <meta property="og:type" content="product" />
  <meta property="og:title" content="Lonier Skin Serum" />
  <meta property="og:image" content="https://lonier.mx/assets/og-image.jpg" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="icon" href="/assets/favicon-gota.png" type="image/png" />
  <link rel="apple-touch-icon" href="/assets/apple-touch-icon-gota.png" />
  <script>
    // Pantalla de carga con la gota (solo cuando se llegó tocando el logo). Ver js/layout.js.
    (function () {
      try {
        if (!sessionStorage.getItem("lonier_loader")) return;
        sessionStorage.removeItem("lonier_loader");
        var root = document.documentElement, start = Date.now();
        root.classList.add("is-loading");
        // Al tocar el logo o jalar para actualizar, la página siempre empieza hasta arriba.
        if ("scrollRestoration" in history) history.scrollRestoration = "manual";
        addEventListener("load", function () {
          scrollTo(0, 0);
          setTimeout(function () {
            scrollTo(0, 0);
            if ("scrollRestoration" in history) history.scrollRestoration = "auto";
            root.classList.add("loaded");
            setTimeout(function () { root.classList.remove("is-loading", "loaded"); }, 360);
          }, Math.max(0, 1100 - (Date.now() - start)));
        });
      } catch (e) {}
    })();
  </script>
  <link rel="preload" href="/assets/fonts/marcellus-latin.woff2" as="font" type="font/woff2" crossorigin />
  <link rel="stylesheet" href="/css/styles.css" />
</head>

<body>
  <div id="site-header"></div>

  <main class="section pdp-section">
    <div class="container">
      <nav class="breadcrumbs" aria-label="Ruta">
        <a href="/">Inicio</a> / <a href="/tienda">Tienda</a> / <span id="crumbName"></span>
      </nav>

      <div class="pdp" id="pdp">
        <div class="pdp-gallery">
          <div class="gallery" id="gallery" aria-roledescription="carrusel" aria-label="Fotos del producto">
            <div class="gallery-track" id="track" tabindex="0"></div>
            <button class="gallery-nav prev" id="prev" aria-label="Foto anterior"><span data-icon="chevronLeft" data-size="22"></span></button>
            <button class="gallery-nav next" id="next" aria-label="Foto siguiente"><span data-icon="chevronRight" data-size="22"></span></button>
            <div class="gallery-dots" id="dots"></div>
          </div>
          <div class="pdp-thumbs" id="thumbs"></div>
        </div>

        <div class="product-info">
          <div class="eyebrow" id="tagline"></div>
          <h1 class="pdp-title" id="name"></h1>

          <div data-promo></div>

          <p id="description"></p>

          <div id="bundles"></div>

          <p class="stock-note" data-stock-note hidden></p>

          <div class="buy-row">
            <div class="qty">
              <button type="button" data-qty="-1" aria-label="Quitar uno"><span data-icon="minus" data-size="18"></span></button>
              <span id="qty">2</span>
              <button type="button" data-qty="1" aria-label="Agregar uno"><span data-icon="plus" data-size="18"></span></button>
            </div>
            <button class="btn btn-primary btn-buy" id="buyNow">Comprar ahora</button>
          </div>
          <button class="btn btn-ghost btn-add" id="addBtn">Agregar al carrito</button>
          <a class="btn btn-ml" id="mlLink" target="_blank" rel="noopener" hidden>Comprar en Mercado Libre</a>

          <div id="payLogos"></div>

          <ul class="trust-list">
            <li><span data-icon="truck" data-size="18"></span><span id="shippingInfo"></span></li>
            <li><span data-icon="shield" data-size="18"></span><span>Pago seguro con Mercado Pago, PayPal o tarjeta</span></li>
            <li><span data-icon="whatsapp" data-size="18"></span><span>¿Dudas? <a id="waLink" target="_blank" rel="noopener">Escríbenos por WhatsApp</a></span></li>
          </ul>

          <div class="feature-list" id="features"></div>
        </div>
      </div>

      <div class="empty" id="notFound" hidden>
        Este producto no está disponible.<br /><a class="link-arrow" href="/tienda">Ir a la tienda</a>
      </div>
    </div>
  </main>

  <section class="section" id="ingredientes">
    <div class="container" data-section="ingredients"></div>
  </section>

  <section class="section" id="como-usar">
    <div class="container" data-section="how-to"></div>
  </section>

  <section class="section results-section">
    <div class="container" data-section="results"></div>
  </section>

  <section class="section precautions-section">
    <div class="container narrow" data-section="precautions"></div>
  </section>

  <div id="site-footer"></div>

  <script type="module">
    import { STORE, PRODUCTS, getProduct, shippingSummary } from "/js/store.js";
    import { initLayout, addToCart, addToCartAndOpen, bindPrices, imgFallback, whatsappUrl } from "/js/layout.js";
    import { applyStock } from "/js/stock.js";
    import { trackViewItem } from "/js/analytics.js";
    import { mountBundlePicker } from "/js/bundles.js";
    import { paymentLogos, renderIcons } from "/js/icons.js";
    import { mountSections } from "/js/sections.js";

    mountSections();
    initLayout();

    const id = new URLSearchParams(location.search).get("id") || PRODUCTS[0].id;
    const product = getProduct(id);

    if (!product) {
      document.getElementById("pdp").hidden = true;
      document.getElementById("notFound").hidden = false;
    } else {
      document.title = `${product.name} | Lonier Skin`;
      document.getElementById("crumbName").textContent = product.name;
      document.getElementById("tagline").textContent = product.tagline;
      document.getElementById("name").textContent = product.name;
      document.getElementById("description").textContent = product.description;
      bindPrices(product);
      document.getElementById("features").innerHTML = product.features.map((f) => `<div>${f}</div>`).join("");
      document.getElementById("shippingInfo").textContent = shippingSummary();
      document.getElementById("waLink").href = whatsappUrl(`Hola, tengo una pregunta sobre ${product.name}.`);
      document.getElementById("payLogos").innerHTML = paymentLogos();

      if (STORE.mercadoLibreUrl) {
        const ml = document.getElementById("mlLink");
        ml.href = STORE.mercadoLibreUrl;
        ml.hidden = false;
      }

      // ---------- Galería: se desliza con el dedo (scroll-snap) y con miniaturas, puntos y flechas ----------
      const track = document.getElementById("track");
      const thumbs = document.getElementById("thumbs");
      const dots = document.getElementById("dots");
      track.innerHTML = product.images
        .map((src, i) => `<div class="slide"><img src="${src}" alt="${product.name} · foto ${i + 1}" ${i ? 'loading="lazy"' : 'fetchpriority="high"'} /></div>`)
        .join("");
      thumbs.innerHTML = product.images
        .map((src, i) => `<button class="pdp-thumb" data-index="${i}" aria-label="Ver foto ${i + 1}"><img src="${src}" alt="" loading="lazy" /></button>`)
        .join("");
      dots.innerHTML = product.images.map((_, i) => `<button data-index="${i}" aria-label="Foto ${i + 1}"></button>`).join("");
      document.querySelectorAll("#gallery img, #thumbs img").forEach(imgFallback);

      let current = 0;
      const goTo = (i) => track.scrollTo({ left: track.clientWidth * i, behavior: "smooth" });
      function markActive(i) {
        current = i;
        thumbs.querySelectorAll(".pdp-thumb").forEach((t, n) => t.classList.toggle("active", n === i));
        dots.querySelectorAll("button").forEach((d, n) => d.classList.toggle("active", n === i));
        document.getElementById("prev").disabled = i === 0;
        document.getElementById("next").disabled = i === product.images.length - 1;
      }
      track.addEventListener("scroll", () => {
        const i = Math.round(track.scrollLeft / track.clientWidth);
        if (i !== current) markActive(i);
      }, { passive: true });
      thumbs.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-index]");
        if (btn) goTo(Number(btn.dataset.index));
      });
      dots.addEventListener("click", (e) => {
        const btn = e.target.closest("[data-index]");
        if (btn) goTo(Number(btn.dataset.index));
      });
      document.getElementById("prev").addEventListener("click", () => goTo(Math.max(0, current - 1)));
      document.getElementById("next").addEventListener("click", () => goTo(Math.min(product.images.length - 1, current + 1)));
      track.addEventListener("keydown", (e) => {
        if (e.key === "ArrowRight") goTo(Math.min(product.images.length - 1, current + 1));
        if (e.key === "ArrowLeft") goTo(Math.max(0, current - 1));
      });
      markActive(0);

      // ---------- Paquetes y cantidad ----------
      const qtyEl = document.getElementById("qty");
      const picker = mountBundlePicker(document.getElementById("bundles"), product, {
        onChange: (qty) => (qtyEl.textContent = qty),
      });
      document.querySelectorAll("[data-qty]").forEach((btn) =>
        btn.addEventListener("click", () => picker.set(picker.qty + Number(btn.dataset.qty)))
      );

      document.getElementById("addBtn").addEventListener("click", () => addToCartAndOpen(product.id, picker.qty));
      document.getElementById("buyNow").addEventListener("click", () => {
        addToCart(product.id, picker.qty);
        location.href = "/carrito";
      });

      ["addBtn", "buyNow"].forEach((id) => (document.getElementById(id).dataset.add = product.id));
      document.querySelector("[data-stock-note]").dataset.stockNote = product.id;
      renderIcons();
      applyStock();
      trackViewItem(product);

      const ld = document.createElement("script");
      ld.type = "application/ld+json";
      ld.textContent = JSON.stringify({
        "@context": "https://schema.org",
        "@type": "Product",
        name: product.name,
        description: product.description,
        image: product.images.map((src) => new URL(src, location.origin).href),
        brand: { "@type": "Brand", name: STORE.name },
        offers: {
          "@type": "Offer",
          priceCurrency: "MXN",
          price: product.price,
          availability: "https://schema.org/InStock",
          url: location.href,
        },
      });
      document.head.appendChild(ld);
    }
  </script>
</body>
</html>
